stlquest:
  database_url: ""
  additional_envs: []
  hosted_storage:
    enabled: true
    bucket: stlquest-hosted
    endpoint: http://minio:9000
    region: us-east-1
    access_key_id: test-access
    secret_access_key: test-secret
    prefix: hosted
    force_path_style: true

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 30455
    host_ips: []
  host_network: false

ix_volumes:
  data: /opt/tests/mnt/data
  prints: /opt/tests/mnt/prints

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      acl_enable: false
      create_host_path: true
  prints:
    type: ix_volume
    ix_volume_config:
      dataset_name: prints
      acl_enable: false
      create_host_path: true

labels: []

resources:
  limits:
    cpus: 2
    memory: 4096
