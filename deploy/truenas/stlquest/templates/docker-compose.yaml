{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.stlquest_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_test("wget", {"port": values.consts.internal_web_port, "path": "/api/health"}) %}

{% if values.stlquest.database_url %}
  {% do c1.environment.add_env("DATABASE_URL", values.stlquest.database_url) %}
{% endif %}
{% if values.stlquest.hosted_storage.enabled %}
  {% do c1.environment.add_env("STLQUEST_HOSTED", "true") %}
  {% do c1.environment.add_env("STLQUEST_HOSTED_STORAGE_BUCKET", values.stlquest.hosted_storage.bucket) %}
  {% do c1.environment.add_env("STLQUEST_HOSTED_STORAGE_ENDPOINT", values.stlquest.hosted_storage.endpoint) %}
  {% do c1.environment.add_env("STLQUEST_HOSTED_STORAGE_REGION", values.stlquest.hosted_storage.region) %}
  {% do c1.environment.add_env("STLQUEST_HOSTED_STORAGE_ACCESS_KEY_ID", values.stlquest.hosted_storage.access_key_id) %}
  {% do c1.environment.add_env("STLQUEST_HOSTED_STORAGE_SECRET_ACCESS_KEY", values.stlquest.hosted_storage.secret_access_key) %}
  {% do c1.environment.add_env("STLQUEST_HOSTED_STORAGE_PREFIX", values.stlquest.hosted_storage.prefix) %}
  {% do c1.environment.add_env("STLQUEST_HOSTED_STORAGE_FORCE_PATH_STYLE", values.stlquest.hosted_storage.force_path_style | string | lower) %}
{% endif %}
{% do c1.environment.add_user_envs(values.stlquest.additional_envs) %}

{% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}

{% do c1.add_storage("/data", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% do c1.add_storage("/prints", values.storage.prints) %}
{% do perm_container.add_or_skip_action("prints", values.storage.prints, perms_config) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"port": values.consts.internal_web_port if values.network.host_network else None}) %}

{{ tpl.render() | tojson }}
