services:
  stlquest:
    image: ghcr.io/richardsolomou/stl.quest:latest
    build:
      context: .
    restart: unless-stopped
    user: '${PUID:-1000}:${PGID:-1000}'
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    ports:
      - '${WEB_PORT:-30455}:3000'
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      PRINTS_DIR_OVERRIDE: ${PRINTS_DIR_OVERRIDE:-}
      STLQUEST_HOSTED: ${STLQUEST_HOSTED:-}
      STLQUEST_HOSTED_STORAGE_BUCKET: ${STLQUEST_HOSTED_STORAGE_BUCKET:-}
      STLQUEST_HOSTED_STORAGE_ENDPOINT: ${STLQUEST_HOSTED_STORAGE_ENDPOINT:-}
      STLQUEST_HOSTED_STORAGE_REGION: ${STLQUEST_HOSTED_STORAGE_REGION:-auto}
      STLQUEST_HOSTED_STORAGE_ACCESS_KEY_ID: ${STLQUEST_HOSTED_STORAGE_ACCESS_KEY_ID:-}
      STLQUEST_HOSTED_STORAGE_SECRET_ACCESS_KEY: ${STLQUEST_HOSTED_STORAGE_SECRET_ACCESS_KEY:-}
      STLQUEST_HOSTED_STORAGE_PREFIX: ${STLQUEST_HOSTED_STORAGE_PREFIX:-}
      STLQUEST_HOSTED_STORAGE_FORCE_PATH_STYLE: ${STLQUEST_HOSTED_STORAGE_FORCE_PATH_STYLE:-false}
      # Password authentication is enabled by default. Set false only after
      # configuring at least one social provider below.
      AUTH_PASSWORD_ENABLED: ${AUTH_PASSWORD_ENABLED:-true}
      AUTH_PASSWORD_RECOVERY: ${AUTH_PASSWORD_RECOVERY:-false}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-true}
      AUTH_DISCORD_CLIENT_ID: ${AUTH_DISCORD_CLIENT_ID:-}
      AUTH_DISCORD_CLIENT_SECRET: ${AUTH_DISCORD_CLIENT_SECRET:-}
      AUTH_DISCORD_ENABLED: ${AUTH_DISCORD_ENABLED:-true}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      # Optional SMTP delivery for invitation and password-reset email.
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:-}
      STLQUEST_CENTRIFUGO_SECRET: ${STLQUEST_CENTRIFUGO_SECRET:-}
      STLQUEST_TRUSTED_PROXY_CIDRS: ${STLQUEST_TRUSTED_PROXY_CIDRS:-private_ranges}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # App data: local SQLite database, integration key, and in-flight uploads.
      - ${DATA_HOST_DIR:-./stlquest-data}:/data
      # Your resin and filament files stay private as plain files organized by production stage.
      - ${PRINTS_HOST_DIR:-./prints}:/prints
