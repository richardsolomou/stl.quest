name: Feature request
description: Suggest an improvement to STL Quest.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow or limitation.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like STL Quest to do?
      description: Describe the smallest useful outcome.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Add examples, screenshots, links, or deployment constraints if useful.
