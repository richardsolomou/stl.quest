name: Bug report
description: Report behavior that is broken or unexpected.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve STL Quest. Do not include secrets, private model files, or unredacted personal information.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe what you did, what happened, and what you expected. Add screenshots if useful.
      placeholder: |
        I was trying to…
        Instead…
        I expected…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: STL Quest version
      description: Container tag, release version, or commit SHA.
      placeholder: v1.26.3
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker or Docker Compose
        - TrueNAS SCALE
        - Unraid
        - HexOS
        - Local development
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste redacted logs or diagnostics if available. This field is formatted as code.
      render: shell
