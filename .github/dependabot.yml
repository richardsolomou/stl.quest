version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - posthog-*
        - '@posthog/*'
    allow:
      - dependency-type: direct
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      patch-updates:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - patch
      minor-updates:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
    ignore:
      - dependency-name: '@better-auth/stripe' # Must match the better-auth version.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: richardsolomou/ras-stack*
        update-types:
          - version-update:semver-major
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - '*ras-stack-runtime-binaries'
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
