version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - posthog-*
        - '@posthog/*'
    allow:
      - dependency-type: direct
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      # Better Auth's plugins pin its core version, so they must move with it; Dependabot puts a package in its first matching group.
      better-auth:
        applies-to: version-updates
        patterns:
          - better-auth
          - '@better-auth/*'
      # The API, stable SDK, and experimental exporters share compatibility constraints.
      opentelemetry:
        applies-to: version-updates
        patterns:
          - '@opentelemetry/*'
      patch-updates:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - patch
      minor-updates:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: richardsolomou/ras-stack*
        update-types:
          - version-update:semver-major
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - '*ras-stack-runtime-binaries'
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
