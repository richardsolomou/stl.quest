name: PR preview deploy

on:
  workflow_run:
    workflows: [PR preview build]
    types: [requested, in_progress, completed]
  pull_request_target:
    types: [closed]

concurrency:
  group: preview-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    permissions:
      actions: read
      contents: read
      packages: write
      checks: write
      issues: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/deploy-dokploy-preview.yml@v0.47.5
    with:
      package: stl.quest
      local-image: stlquest
      application-prefix: stlquest
      domain: stl.quest
      port: 3000
      marker: <!-- stlquest-preview -->
      note: Sign in with `preview@stl.quest` / `preview-preview-preview`. The URL is behind the shared preview basic-auth credentials. Preview data is disposable and resets on every deployment.
      deploy-script: scripts/previewDeploy.ts
      playwright-config: playwright.preview.config.ts
    secrets: inherit
