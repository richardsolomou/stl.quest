name: Build and push image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production-release' || github.run_id }}
  queue: max

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stlquest_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stlquest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/stlquest_test
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.27.0
      - uses: richardsolomou/ras-stack/actions/setup-just@v0.27.0
        with:
          version: '1.58.0'
      - run: pnpm audit --audit-level high
      - run: just check

  e2e:
    if: github.event_name != 'schedule'
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.27.0
      - uses: richardsolomou/ras-stack/actions/setup-just@v0.27.0
        with:
          version: '1.58.0'
      - if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v4
      - name: Build the E2E image
        if: github.event_name != 'pull_request'
        run: |
          docker buildx build \
            --cache-from "type=registry,ref=$IMAGE_CACHE" \
            --load \
            --tag stlquest-e2e \
            .
        env:
          IMAGE_CACHE: ghcr.io/${{ github.repository_owner }}/stl.quest:buildcache-amd64
      - name: Build the production server
        if: github.event_name == 'pull_request'
        run: pnpm build
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: pnpm exec playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Run core E2E suite
        if: github.event_name != 'pull_request'
        run: PLAYWRIGHT_CORE_ONLY=1 sh scripts/runE2e.sh e2e/00-stlquest.spec.ts e2e/request-ordering.spec.ts
      - name: Run fast core E2E suite
        if: github.event_name == 'pull_request'
        run: PLAYWRIGHT_CORE_ONLY=1 PLAYWRIGHT_FAST_SERVER=1 sh scripts/runE2e.sh e2e/00-stlquest.spec.ts e2e/request-ordering.spec.ts
      - name: Run distributed realtime E2E suite
        if: github.event_name != 'pull_request'
        run: pnpm exec playwright test --config playwright.distributed.config.ts

  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        continue-on-error: true
        with:
          fail-on-severity: high

  shared-storage-contract:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.27.0
      - name: Start pinned MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for _ in {1..30}; do curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0; sleep 2; done
          docker logs minio
          exit 1
      - name: Start pinned Redis
        run: docker run -d --name redis -p 6379:6379 redis:7.4.2-alpine
      - name: Start pinned PostgreSQL
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_DB=stlquest_distributed_test -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres \
            postgres:16
          for _ in {1..30}; do docker exec postgres pg_isready -U postgres -d stlquest_distributed_test && exit 0; sleep 2; done
          docker logs postgres
          exit 1
      - run: pnpm exec vitest run src/adapters/storeContract.test.ts src/adapters/distributedUploads.integration.test.ts src/server/distributedUploadFlow.integration.test.ts
        env:
          MINIO_TEST_URL: http://127.0.0.1:9000
          MINIO_TEST_ACCESS_KEY: minioadmin
          MINIO_TEST_SECRET_KEY: minioadmin
          DISTRIBUTED_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          DISTRIBUTED_TEST_S3_ACCESS_KEY_ID: minioadmin
          DISTRIBUTED_TEST_S3_SECRET_ACCESS_KEY: minioadmin
          DISTRIBUTED_TEST_REDIS_URL: redis://127.0.0.1:6379
          DISTRIBUTED_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/stlquest_distributed_test

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: [check, e2e, shared-storage-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created || 'false' }}
      tag: ${{ steps.release.outputs.tag || '' }}
      sha: ${{ steps.release.outputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGESETS_TOKEN || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Check for pending changesets
        id: changesets
        run: |
          count="$(grep -lE ": (patch|minor|major)$" .changeset/*.md | wc -l | tr -d ' ')"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$count" != "0" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.27.0
        if: steps.changesets.outputs.pending == 'true'
      - name: Release directly from main
        id: release
        if: steps.changesets.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git fetch origin main --tags
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            {
              echo "created=false"
              echo "tag="
              echo "sha=$GITHUB_SHA"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pnpm version-packages

          tag="v$(node -p "require('./package.json').version")"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
            exit 1
          fi

          git add .changeset CHANGELOG.md deploy/truenas/stlquest/app.yaml deploy/truenas/stlquest/ix_values.yaml package.json
          git commit -m "chore: release ${tag} [skip ci]"
          release_sha="$(git rev-parse HEAD)"
          git tag "$tag"
          git push --atomic origin HEAD:main "$tag"
          gh release create "$tag" --title "$tag" --generate-notes

          {
            echo "created=true"
            echo "tag=$tag"
            echo "sha=$release_sha"
          } >> "$GITHUB_OUTPUT"

  build-image:
    if: needs.release.outputs.created == 'true'
    needs: [check, e2e, release]
    name: Build image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare stable package manifest
        run: |
          mkdir -p "$RUNNER_TEMP/package-manifest"
          node -e "const fs = require('node:fs'); const manifest = require('./package.json'); delete manifest.version; fs.writeFileSync(process.argv[1], JSON.stringify(manifest));" "$RUNNER_TEMP/package-manifest/package.json"
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          build-contexts: package-manifest=${{ runner.temp }}/package-manifest
          platforms: ${{ matrix.platform }}
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}
            VITE_POSTHOG_PROJECT_TOKEN=${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/stl.quest,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/stl.quest:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/stl.quest:buildcache-${{ matrix.arch }},mode=max,oci-mediatypes=true,compression=zstd
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-image:
    if: needs.release.outputs.created == 'true'
    needs: [check, e2e, release, build-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          images=()
          for digest in *; do
            images+=("${IMAGE}@sha256:${digest}")
          done

          tags=(
            --tag "${IMAGE}:latest"
            --tag "${IMAGE}:sha-${IMAGE_SHA}"
          )
          if [ "$RELEASE_CREATED" = "true" ]; then
            tags+=(--tag "${IMAGE}:${RELEASE_TAG}")
          fi

          docker buildx imagetools create \
            "${tags[@]}" \
            "${images[@]}"
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/stl.quest
          IMAGE_SHA: ${{ needs.release.outputs.sha }}
          RELEASE_CREATED: ${{ needs.release.outputs.created }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/stl.quest:sha-${{ needs.release.outputs.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          scanners: vuln
          hide-progress: true
      - name: Deploy production application
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          curl --fail-with-body \
            --request POST \
            --header "x-api-key: ${DOKPLOY_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$(jq --null-input --arg applicationId "$DOKPLOY_APPLICATION_ID" '{ applicationId: $applicationId }')" \
            "${DOKPLOY_URL%/}/api/application.deploy"
