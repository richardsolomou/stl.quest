name: Build and push image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      republish_tag:
        description: Release tag (vX.Y.Z) whose recorded candidate image to verify, publish and deploy without rebuilding.
        type: string
        default: ''
      republish_dry_run:
        description: With republish_tag, verify the recorded candidate and tag it as verified-<commit> only.
        type: boolean
        default: false
  schedule:
    - cron: '23 3 * * 1'

concurrency:
  group: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.republish_tag) && 'production-release' || github.run_id }}
  queue: max

jobs:
  check:
    if: github.event_name != 'schedule' && !inputs.republish_tag
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stlquest_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stlquest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/stlquest_test
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - uses: richardsolomou/ras-stack/actions/setup-just@v1
        with:
          version: '1.58.0'
      - run: pnpm audit --audit-level high
      - run: just check-ci

  test:
    if: github.event_name != 'schedule' && !inputs.republish_tag
    name: Test (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stlquest_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stlquest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/stlquest_test
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/2

  e2e:
    if: github.event_name == 'pull_request'
    name: E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: &e2e-shards
          - name: core
            specs: e2e/00-stlquest.spec.ts
          - name: ordering
            specs: e2e/account-settings.spec.ts e2e/chunk-recovery.spec.ts e2e/request-ordering.spec.ts
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - uses: richardsolomou/ras-stack/actions/setup-just@v1
        with:
          version: '1.58.0'
      - name: Build the production server
        run: pnpm build
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Run core E2E shard
        run: sh scripts/runE2e.sh ${{ matrix.specs }}
        env:
          PLAYWRIGHT_CORE_ONLY: '1'
          PLAYWRIGHT_FAST_SERVER: '1'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.name }}-results
          path: test-results/
          retention-days: 14

  e2e-image:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: E2E (${{ matrix.name }})
    needs: candidate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: *e2e-shards
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - uses: ./.github/actions/load-e2e-image
        with:
          image: ${{ needs.candidate.outputs.image }}
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Run core E2E shard
        run: sh scripts/runE2e.sh ${{ matrix.specs }}
        env:
          PLAYWRIGHT_CORE_ONLY: '1'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.name }}-results
          path: test-results/
          retention-days: 14

  e2e-distributed:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: E2E (distributed)
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - uses: ./.github/actions/load-e2e-image
        with:
          image: ${{ needs.candidate.outputs.image }}
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - run: pnpm exec playwright test --config playwright.distributed.config.ts
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-distributed-results
          path: test-results/
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        continue-on-error: true
        with:
          fail-on-severity: high

  shared-storage-contract:
    if: ${{ !inputs.republish_tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Start pinned MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1 server /data
          for _ in {1..30}; do curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0; sleep 2; done
          docker logs minio
          exit 1
      - name: Start pinned Redis
        run: docker run -d --name redis -p 6379:6379 redis:7.4.2-alpine
      - name: Start pinned PostgreSQL
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_DB=stlquest_distributed_test -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres \
            postgres:16
          for _ in {1..30}; do docker exec postgres pg_isready -U postgres -d stlquest_distributed_test && exit 0; sleep 2; done
          docker logs postgres
          exit 1
      - run: pnpm exec vitest run src/adapters/storeContract.test.ts src/adapters/distributedUploads.integration.test.ts src/server/distributedUploadFlow.integration.test.ts
        env:
          MINIO_TEST_URL: http://127.0.0.1:9000
          MINIO_TEST_ACCESS_KEY: minioadmin
          MINIO_TEST_SECRET_KEY: minioadmin
          DISTRIBUTED_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          DISTRIBUTED_TEST_S3_ACCESS_KEY_ID: minioadmin
          DISTRIBUTED_TEST_S3_SECRET_ACCESS_KEY: minioadmin
          DISTRIBUTED_TEST_REDIS_URL: redis://127.0.0.1:6379
          DISTRIBUTED_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/stlquest_distributed_test

  image:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    name: Build test image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: stlquest-e2e
          outputs: type=docker,dest=${{ runner.temp }}/stlquest-e2e.tar
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/stl.quest:buildcache-amd64
          no-cache-filters: runtime
      - uses: actions/upload-artifact@v7
        with:
          name: stlquest-e2e-image
          path: ${{ runner.temp }}/stlquest-e2e.tar
          if-no-files-found: error
          retention-days: 1

  release-plan:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !inputs.republish_tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      tag: ${{ steps.plan.outputs.tag }}
      tree: ${{ steps.plan.outputs.tree }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      # Mirrors the versioning step of the release workflow, so the candidate image is built from the
      # exact tree that the release commit will have.
      - name: Apply pending changesets
        id: plan
        run: |
          shopt -s nullglob
          pending=false
          for file in .changeset/*.md; do
            if grep -qE ': (patch|minor|major)$' "$file"; then
              pnpm version-packages
              pending=true
              break
            fi
          done
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/release.patch"
          echo "tree=$(git write-tree)" >> "$GITHUB_OUTPUT"
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-patch
          path: ${{ runner.temp }}/release.patch
          if-no-files-found: error
          retention-days: 1

  candidate-build:
    needs: release-plan
    name: Build image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-patch
          path: ${{ runner.temp }}
      - name: Apply release versions
        run: |
          if [ -s "$RUNNER_TEMP/release.patch" ]; then
            git apply --index "$RUNNER_TEMP/release.patch"
          fi
          test "$(git write-tree)" = "$RELEASE_TREE"
        env:
          RELEASE_TREE: ${{ needs.release-plan.outputs.tree }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}
            VITE_POSTHOG_PROJECT_TOKEN=${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
            POSTHOG_PROJECT_ID=${{ vars.POSTHOG_PROJECT_ID }}
            POSTHOG_HOST=${{ vars.POSTHOG_HOST }}
            GITHUB_ACTIONS=true
            GITHUB_SHA=${{ github.sha }}
            GITHUB_REF_NAME=${{ github.ref_name }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_SERVER_URL=${{ github.server_url }}
          secrets: |
            POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/stl.quest,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/stl.quest:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/stl.quest:buildcache-${{ matrix.arch }},mode=max,oci-mediatypes=true,compression=zstd
          no-cache-filters: runtime
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  candidate:
    name: Push candidate image
    needs: candidate-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.candidate.outputs.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-platform candidate
        id: candidate
        working-directory: ${{ runner.temp }}/digests
        run: |
          images=()
          for digest in *; do
            images+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create --tag "${IMAGE}:candidate-${GITHUB_SHA}" "${images[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:candidate-${GITHUB_SHA}" --format '{{.Manifest.Digest}}')"
          echo "image=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Candidate: ${IMAGE}@${digest}" >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/stl.quest

  e2e-deployments:
    if: ${{ !cancelled() && github.event_name != 'schedule' && (needs.image.result == 'success' || needs.candidate.result == 'success') }}
    name: E2E (deployments)
    needs: [image, candidate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - uses: ./.github/actions/load-e2e-image
        with:
          image: ${{ needs.candidate.outputs.image }}
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - run: sh scripts/runE2e.sh --project hosted-managed --project self-hosted-http --project self-hosted-https --project preview-seed
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-deployments-results
          path: test-results/
          retention-days: 14

  container-security:
    if: ${{ !cancelled() && (needs.image.result == 'success' || needs.candidate.result == 'success') }}
    needs: [image, candidate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-e2e-image
        with:
          image: ${{ needs.candidate.outputs.image }}
      - name: Scan production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stlquest-e2e
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          scanners: vuln
          hide-progress: true

  arm64-smoke:
    name: Smoke test (arm64)
    needs: candidate
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-e2e-image
        with:
          image: ${{ needs.candidate.outputs.image }}
      - run: test "$(docker image inspect --format '{{.Architecture}}' stlquest-e2e)" = arm64
      - run: sh scripts/smokeContainer.sh

  release-gate:
    name: Release checks
    # With the skipped PR image job as an ancestor, both the implicit success() check and a
    # needs.*.result filter skip this job, so each direct dependency is checked by name.
    if: >-
      ${{ !cancelled() && needs.check.result == 'success' && needs.test.result == 'success' &&
      needs.e2e-image.result == 'success' && needs.e2e-distributed.result == 'success' &&
      needs.e2e-deployments.result == 'success' && needs.shared-storage-contract.result == 'success' &&
      needs.container-security.result == 'success' && needs.arm64-smoke.result == 'success' }}
    needs: [check, test, e2e-image, e2e-distributed, e2e-deployments, shared-storage-contract, container-security, arm64-smoke]
    runs-on: ubuntu-latest
    steps:
      - run: echo "The candidate image passed every release check."

  release:
    if: ${{ !cancelled() && needs.release-gate.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    needs: release-gate
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/release-changesets.yml@v1
    secrets:
      CHANGESETS_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}

  # Publishes a created release or republishes a recorded one. Other main and manual runs without
  # pending changesets take the same path with verified-<commit> as the only tag, which proves the
  # tree check and retag without publishing.
  publish-image:
    if: >-
      ${{ !cancelled() && (inputs.republish_tag || (needs.release-gate.result == 'success' &&
      (needs.release.outputs.created == 'true' || (needs.release-plan.outputs.pending == 'false' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped'))))) }}
    needs: [release-plan, candidate, release-gate, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the image and tags
        id: target
        run: |
          if [ -n "$REPUBLISH_TAG" ]; then
            if ! gh release download "$REPUBLISH_TAG" --pattern candidate-image.txt --dir "$RUNNER_TEMP"; then
              echo "::error::$REPUBLISH_TAG has no recorded candidate-image.txt asset to republish"
              exit 1
            fi
            image="$(sed -n 's/^image=//p' "$RUNNER_TEMP/candidate-image.txt")"
            tree="$(sed -n 's/^tree=//p' "$RUNNER_TEMP/candidate-image.txt")"
            git fetch --depth 1 origin "refs/tags/$REPUBLISH_TAG"
            commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
            tag="$REPUBLISH_TAG"
            if [ "$REPUBLISH_DRY_RUN" = true ]; then tag=; fi
          elif [ "$CREATED" = true ]; then
            test "$RELEASE_TAG" = "$PLANNED_TAG"
            image="$CANDIDATE" tree="$PLANNED_TREE" commit="$RELEASE_SHA" tag="$RELEASE_TAG"
          else
            image="$CANDIDATE" tree="$PLANNED_TREE" commit="$GITHUB_SHA" tag=
          fi
          deploy=false
          if [ -z "$tag" ]; then
            tags="verified-${commit}"
          else
            tags="${tag} sha-${commit}"
            # A rerun or republish of an older release must not move latest or production backwards.
            if [ "$(gh release view --json tagName --jq .tagName)" = "$tag" ]; then
              tags="${tags} latest"
              deploy=true
            fi
          fi
          {
            echo "image=$image"
            echo "tree=$tree"
            echo "commit=$commit"
            echo "tag=$tag"
            echo "tags=$tags"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"
        env:
          CANDIDATE: ${{ needs.candidate.outputs.image }}
          CREATED: ${{ needs.release.outputs.created }}
          GH_TOKEN: ${{ github.token }}
          PLANNED_TAG: ${{ needs.release-plan.outputs.tag }}
          PLANNED_TREE: ${{ needs.release-plan.outputs.tree }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          REPUBLISH_DRY_RUN: ${{ inputs.republish_dry_run }}
          REPUBLISH_TAG: ${{ inputs.republish_tag }}
      - name: Check the commit matches the tested tree
        run: |
          git fetch --depth 1 origin "$COMMIT"
          if [ "$(git rev-parse "${COMMIT}^{tree}")" != "$TREE" ]; then
            echo "::error::${COMMIT} does not have the tree ${TREE} that the candidate was built and tested from"
            exit 1
          fi
        env:
          COMMIT: ${{ steps.target.outputs.commit }}
          TREE: ${{ steps.target.outputs.tree }}
      - name: Record the tested candidate on the release
        if: steps.target.outputs.tag != '' && !inputs.republish_tag
        run: |
          printf 'image=%s\ntree=%s\n' "$IMAGE" "$TREE" > "$RUNNER_TEMP/candidate-image.txt"
          gh release upload "$TAG" "$RUNNER_TEMP/candidate-image.txt" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.target.outputs.image }}
          TAG: ${{ steps.target.outputs.tag }}
          TREE: ${{ steps.target.outputs.tree }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the tested candidate
        run: |
          read -ra tags <<< "$TAGS"
          docker buildx imagetools create "${tags[@]/#/--tag=${REPOSITORY}:}" "$IMAGE"
          for tag in "${tags[@]}"; do
            digest="$(docker buildx imagetools inspect "${REPOSITORY}:${tag}" --format '{{.Manifest.Digest}}')"
            if [ "$digest" != "${IMAGE#*@}" ]; then
              echo "::error::${REPOSITORY}:${tag} resolves to ${digest}, not the tested ${IMAGE#*@}"
              exit 1
            fi
          done
          echo "Tagged ${IMAGE} as ${tags[*]}" >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/stl.quest
          TAGS: ${{ steps.target.outputs.tags }}
      - name: Resolve production image
        id: image
        if: steps.target.outputs.deploy == 'true'
        uses: richardsolomou/ras-stack/actions/resolve-container-image@v1
        with:
          image: ghcr.io/${{ github.repository_owner }}/stl.quest:sha-${{ steps.target.outputs.commit }}
      - name: Deploy production application
        if: steps.target.outputs.deploy == 'true' && vars.DOKPLOY_IMAGE_DEPLOY == 'true'
        uses: richardsolomou/ras-stack/actions/deploy-dokploy-image@v1
        with:
          url: ${{ secrets.DOKPLOY_URL }}
          api-key: ${{ secrets.DOKPLOY_API_KEY }}
          application-id: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          image: ${{ steps.image.outputs.reference }}
