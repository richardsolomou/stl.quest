name: PR preview prune

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

jobs:
  previews:
    permissions:
      contents: read
      packages: write
      pull-requests: read
    uses: richardsolomou/ras-stack/.github/workflows/prune-dokploy-previews.yml@v0.36.0
    with:
      package: stl.quest
      application-prefix: stlquest
      domain: stl.quest
      port: 3000
      deploy-script: scripts/previewDeploy.ts
    secrets: inherit
