name: PR preview build

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mark-deploying:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.30.1
      - name: Mark preview as deploying
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_MARKER: <!-- stlquest-preview -->
          PREVIEW_NOTE: Sign in with `preview@stl.quest` / `preview-preview-preview`. The URL is behind the shared preview basic-auth credentials. Preview data is disposable and resets on every deployment.
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.stl.quest
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm exec ras-stack-preview building

  build:
    name: Preview image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the container registry
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish preview image
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          docker buildx build \
            --cache-from "type=registry,ref=$IMAGE_CACHE" \
            --push \
            --tag "$PREVIEW_IMAGE" \
            .
        env:
          IMAGE_CACHE: ghcr.io/${{ github.repository_owner }}/stl.quest:buildcache-amd64
          PREVIEW_IMAGE: ghcr.io/${{ github.repository_owner }}/stl.quest-preview:pr-${{ github.event.pull_request.number }}
      - name: Build fork preview image
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          docker buildx build \
            --cache-from "type=registry,ref=$IMAGE_CACHE" \
            --load \
            --tag "$SOURCE_IMAGE" \
            .
        env:
          IMAGE_CACHE: ghcr.io/${{ github.repository_owner }}/stl.quest:buildcache-amd64
          SOURCE_IMAGE: stlquest-preview:${{ github.event.pull_request.head.sha }}
      - name: Export preview image
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: docker save "$SOURCE_IMAGE" --output "$RUNNER_TEMP/preview-image.tar"
        env:
          SOURCE_IMAGE: stlquest-preview:${{ github.event.pull_request.head.sha }}
      - name: Store preview image
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v7
        with:
          name: preview-image-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/preview-image.tar
          retention-days: 1
          compression-level: 0
