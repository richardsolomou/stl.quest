name: PR preview build

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mark-deploying:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mark preview as deploying
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec tsx scripts/previewComment.ts building

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the container registry
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare stable package manifest
        run: |
          mkdir -p "$RUNNER_TEMP/package-manifest"
          node -e "const fs = require('node:fs'); const manifest = require('./package.json'); delete manifest.version; fs.writeFileSync(process.argv[1], JSON.stringify(manifest));" "$RUNNER_TEMP/package-manifest/package.json"
      - name: Build preview image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: package-manifest=${{ runner.temp }}/package-manifest
          platforms: linux/amd64
          tags: ${{ github.event.pull_request.head.repo.full_name == github.repository && format('ghcr.io/{0}/stl.quest-preview:pr-{1}', github.repository_owner, github.event.pull_request.number) || format('stlquest-preview:{0}', github.event.pull_request.head.sha) }}
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          outputs: ${{ github.event.pull_request.head.repo.full_name != github.repository && format('type=docker,dest={0}/preview-image.tar', runner.temp) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Store preview image
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v7
        with:
          name: preview-image-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/preview-image.tar
          retention-days: 1
          compression-level: 0
