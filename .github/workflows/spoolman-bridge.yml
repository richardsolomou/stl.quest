name: Spoolman bridge image

on:
  push:
    branches: [main]
    paths:
      - spoolman-bridge/**
      - .github/workflows/spoolman-bridge.yml
  pull_request:
    paths:
      - spoolman-bridge/**
      - .github/workflows/spoolman-bridge.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Check the bridge starts
        run: |
          docker build --load -t spoolman-bridge:check spoolman-bridge
          docker run --rm spoolman-bridge:check 2>&1 | grep -q 'SPOOLMAN_URL is required'
      - uses: docker/login-action@v4.8.0
        # Only main publishes, so a manual run on another branch never moves the `latest` users pull.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: spoolman-bridge
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/stl.quest-spoolman-bridge:latest
            ghcr.io/${{ github.repository_owner }}/stl.quest-spoolman-bridge:sha-${{ github.sha }}
