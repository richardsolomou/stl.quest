allowBuilds:
  '@posthog/cli': true
  argon2: true
  better-sqlite3: true
  core-js: false
  esbuild: true
  protobufjs: false

minimumReleaseAge: 10080
peerDependencyRules:
  allowedVersions:
    better-sqlite3: '13'
    ioredis: '6'

overrides:
  '@ts-morph/common>minimatch': 10.2.6
  fast-uri: 3.1.8
  ip-address: 10.7.3
  nanoid: 3.3.20
  'js-yaml@>=3.0.0 <3.15.1': 3.15.1
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  sharp: 0.35.5
  undici: 7.30.0
  webdav>minimatch: 10.2.6
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
minimumReleaseAgeExclude:
  - 'posthog-*'
  - '@posthog/*'
  - ras-stack
auditConfig:
  ignoreGhsas:
    # The build rejects picomatch in shipped JavaScript. Remove once a patched release is available.
    - GHSA-fc5q-39xc-vjpf
