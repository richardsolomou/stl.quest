  argon2: true
  better-sqlite3: true
  core-js: true
  esbuild: true
  protobufjs: false
  sharp: false
  workerd: true

minimumReleaseAge: 10080
peerDependencyRules:
  allowedVersions:
    better-sqlite3: '13'
    ioredis: '6'

overrides:
  '@ts-morph/common>minimatch': 10.2.6
  fast-uri: 3.1.8
  ip-address: 10.7.3
  nanoid: 3.3.20
  'js-yaml@>=3.0.0 <3.15.1': 3.15.1
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  sharp: 0.35.5
  undici: 7.30.0
  webdav>minimatch: 10.2.6
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
minimumReleaseAgeExclude:
  - ras-stack@5.0.0
  - ras-stack@5.1.0
  # Reviewed exact versions from the RAS candidate; retain the seven-day gate for other packages.
  - '@better-auth/core@1.7.10'
  - '@better-auth/drizzle-adapter@1.7.10'
  - '@better-auth/kysely-adapter@1.7.10'
  - '@better-auth/memory-adapter@1.7.10'
  - '@better-auth/mongo-adapter@1.7.10'
  - '@better-auth/prisma-adapter@1.7.10'
  - '@better-auth/telemetry@1.7.10'
  - '@better-auth/stripe@1.7.10'
  - '@posthog/browser-common@0.9.5'
  - '@posthog/core@1.59.1'
  - better-auth@1.7.10
  - posthog-js@1.438.12
  - posthog-node@5.56.2
configDependencies:
  ras-stack: 5.1.0
pnpmfile: node_modules/.pnpm-config/ras-stack/pnpmfile.mjs
